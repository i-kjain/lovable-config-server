server:
  port: 9030
  servlet.context-path: /intelligence

spring:
  datasource:
    url: jdbc:postgresql://localhost:9010/lovable-intelligence-db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  ai:
    model.chat: openai
    openai:
      api-key: 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
      base-url: https://openrouter.ai/api
      chat:
        options:
          model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
          temperature: 0.2
      embedding:
        options:
          model: qwen/qwen3-embedding-8b

---

spring:
  config:
    activate:
      on-profile: k8s
  datasource:
    url: jdbc:postgresql://pgvector.lovable-core.svc.cluster.local:5432/intelligence_db
    username: intelligence_user
    password: ${DB_PASSWORD}

ai:
    openai:
      api-key: ${AI_API_KEY}
    chat:
        options:
          model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
